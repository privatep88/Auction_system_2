name: Deploy SAAED Vehicle Auctions to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build & Verify Vite Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies cleanly
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run 12-point financial validation suite
        run: npm test

      - name: Resolve GitHub Pages base path
        id: pages_config
        shell: bash
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "base_path=/" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/${REPO_NAME}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Build production bundle
        env:
          VITE_BASE_PATH: ${{ steps.pages_config.outputs.base_path }}
        run: npm run build

      - name: Verify production bundle integrity
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/404.html
          test -f dist/.nojekyll
          test -d dist/assets
          test -f dist/assets/aistudio/logo_1afd1154.png
          if grep -q "/src/main.tsx" dist/index.html; then
            echo "ERROR: Uncompiled /src/main.tsx script found in dist/index.html"
            exit 1
          fi
          ls -lh dist dist/assets

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
